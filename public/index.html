<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Playlist Length Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero-card">
        <div class="badge">YouTube playlist calculator</div>
        <h2>Get the total length of any YouTube playlist in seconds.</h2>
        <p class="lede">
          Paste a playlist URL and get the total runtime in hours, minutes, and seconds with a clean,
          simple interface.
        </p>

        <form id="playlist-form" class="input-row">
          <input
            id="playlist-url"
            type="url"
            placeholder="https://www.youtube.com/playlist?list=..."
            autocomplete="off"
            spellcheck="false"
            required
          />
          <button type="submit">Calculate length</button>
        </form>

        <div id="status" class="status" aria-live="polite"></div>

        <div id="result" class="result hidden">
          <div class="result-top">
            <div>
              <p class="result-label">Total length</p>
              <h2 id="duration-text">0h 0m 0s</h2>
            </div>
            <div class="result-pill" id="duration-digital">00:00:00</div>
          </div>

          <div class="result-grid">
            <div>
              <span>Playlist</span>
              <strong id="playlist-title">-</strong>
            </div>
            <div>
              <span>Videos</span>
              <strong id="playlist-count">0</strong>
            </div>
            <div>
              <span>Source</span>
              <strong>YouTube</strong>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
